<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas - Real Estate Development Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Global error handler to prevent white page
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;background:#f9fafb;padding:20px">' +
            '<div style="text-align:center;max-width:500px">' +
            '<h1 style="font-size:24px;font-weight:bold;color:#111827;margin-bottom:8px">Atlas</h1>' +
            '<p style="color:#6b7280;margin-bottom:16px">Something went wrong loading the application.</p>' +
            '<p style="color:#ef4444;font-size:14px;margin-bottom:16px">' + (e.message || 'Unknown error') + '</p>' +
            '<button onclick="location.reload()" style="padding:8px 24px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px">Reload Page</button>' +
            '</div></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
